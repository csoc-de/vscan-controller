services:
  controller:
    build: .
    restart: unless-stopped
    ports:
      - ${PORT:-8080}:${PORT:-8080}
    environment:
      DEV: true
      API_KEY: ${API_KEY}
      PORT: ${PORT:-8080}
      GREENBONE_SOCKET_PATH: ${GREENBONE_SOCKET_PATH:-/run/gvmd}
      GREENBONE_USER: ${GREENBONE_USER:-admin}
      GREENBONE_PASSWORD: ${GREENBONE_PASSWORD:-admin}
      LOG_LEVEL: ${LOG_LEVEL:-Debug}
      HOST: ${HOST:-0.0.0.0}
    volumes:
      - gvmd-sock:/run/gvmd

  openvas:
    image: immauss/openvas:latest
    ports:
      - 9392:9392
    environment:
      PASSWORD: ${GREENBONE_USER:-admin}
      USERNAME: ${GREENBONE_PASSWORD:-admin}
      RELAYHOST: 172.17.0.1
      SMTPPORT: 25
      REDISDBS: 512 # number of Redis DBs to use
      QUIET: false # dump feed sync noise to /dev/null
      NEWDB: false # only use this for creating a blank DB
      SKIPSYNC: true # Skips the feed sync on startup.
      RESTORE: false # This probably not be used from compose... see docs.
      DEBUG: false # This will cause the container to stop and not actually start gvmd
      HTTPS: false # wether to use HTTPS or not
      GMP: 9390 # to enable see docs
      PGVER: 15 # Set postgresql version ... either 13 or 15
    volumes:
      - openvas:/data
      - gvmd-sock:/run/gvmd

volumes:
  openvas:
  gvmd-sock:
