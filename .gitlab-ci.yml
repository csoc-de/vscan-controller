default:
  image: ${HARBOR_HOST}/dockerhub/library/docker:28.0.1
  services:
    - name: ${HARBOR_HOST}/dockerhub/library/docker:28.0.1-dind
      alias: docker

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - lint
  - test
  - check
  - deploy

build:
  stage: build
  only:
    - branches
  except:
    - tags
  script:
    - docker build --pull .

linter:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: lint
  needs: []
  before_script:
    - pip install pylint
    - pip install -r requirements.txt
  script:
    - pylint ${CI_PROJECT_DIR}/app

unit:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: test
  needs: []
  before_script:
    - pip install pytest pytest-cov
    - pip install -r requirements.txt
  script:
    - pytest --cov=. --cov-report term-missing --cov-report html:coverage.html --cov-report xml:coverage.xml --junitxml=report.xml
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    when: always
    paths:
      - report.xml
      - coverage.xml
      - coverage.html
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 2 days

sbom:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: check
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  tags:
    - default
  before_script:
    - python3 -m venv /builds/${CI_PROJECT_PATH}/venv
    - cd /builds/${CI_PROJECT_PATH}
    - source venv/bin/activate
    - python -m pip install -r requirements.txt
    - python -m pip install cyclonedx-bom
  script:
    - cyclonedx-py environment --gather-license-texts -o sbom.xml --of XML -v --validate /builds/${CI_PROJECT_PATH}/venv
    - |
      BOM_B64=$(base64 -w 0 sbom.xml)
      if [ -n "${CI_COMMIT_TAG}" ]; then
        echo "Uploading SBOM: project=${CI_PROJECT_NAME}, version=${CI_COMMIT_TAG}, parent=main"
        cat > payload.json <<PAYLOAD_EOF
      {
        "projectName": "${CI_PROJECT_NAME}",
        "projectVersion": "${CI_COMMIT_TAG}",
        "parentName": "${CI_PROJECT_NAME}",
        "parentVersion": "main",
        "autoCreate": true,
        "bom": "${BOM_B64}"
      }
      PAYLOAD_EOF
      else
        echo "Uploading SBOM: project=${CI_PROJECT_NAME}, version=main (überschreibt)"
        cat > payload.json <<PAYLOAD_EOF
      {
        "projectName": "${CI_PROJECT_NAME}",
        "projectVersion": "main",
        "autoCreate": true,
        "isLatest": true,
        "bom": "${BOM_B64}"
      }
      PAYLOAD_EOF
      fi
    - |
      curl -f -X "PUT" "${DTRACK_URL}/api/v1/bom" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: ${DTRACK_APIKEY}" \
        -d @payload.json
  artifacts:
    when: always
    paths:
      - sbom.xml
    expire_in: 2 days

release-latest:
  stage: deploy
  only:
    - master
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_HOST} -u ${HARBOR_USERNAME} --password-stdin
  script:
    - docker build --pull -t $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:latest .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:latest

release-tag:
  stage: deploy
  only:
    - tags
  except:
    - branches
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_HOST} -u ${HARBOR_USERNAME} --password-stdin
  script:
    - docker build --pull -t $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} -t $HARBOR_HOST/$HARBOR_PROJECT/csoc-v-${CI_PROJECT_NAME}:${CI_COMMIT_TAG} .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/csoc-v-${CI_PROJECT_NAME}:${CI_COMMIT_TAG}
