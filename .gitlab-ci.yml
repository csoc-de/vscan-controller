default:
  image: ${HARBOR_HOST}/dockerhub/library/docker:28.0.1
  services:
    - name: ${HARBOR_HOST}/dockerhub/library/docker:28.0.1-dind
      alias: docker

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - style
  - test
  - check
  - deploy

build:
  stage: build
  only:
    - branches
  except:
    - tags
  script:
    - docker build --pull .

.ruff:
  stage: style
  image:
    name: ${HARBOR_HOST}/csoc-registry/ruff:0.17.4
    entrypoint: [""]
  before_script:
    - ruff --version

lint:
  extends: .ruff
  script:
    - ruff check --output-format gitlab --output-file code-quality-report.json
    - cat code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

format:
  extends: .ruff
  script:
    - ruff format --check --output-format gitlab

unit:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: test
  needs: []
  before_script:
    - pip install . --group dev
  script:
    - pytest --cov=vscan_controller --cov-report term-missing --cov-report html:coverage.html --cov-report xml:coverage.xml --junitxml=report.xml
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    when: always
    paths:
      - report.xml
      - coverage.xml
      - coverage.html
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 2 days

sbom:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: check
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  tags:
    - default
  before_script:
    - python3 -m venv /builds/${CI_PROJECT_PATH}/venv
    - cd /builds/${CI_PROJECT_PATH}
    - source venv/bin/activate
    - python -m pip install -r requirements.txt
    - python -m pip install cyclonedx-bom
  script:
    - cyclonedx-py environment --gather-license-texts --output-reproducible -o sbom.xml -v --validate /builds/${CI_PROJECT_PATH}/venv
    - |
      BOM_B64=$(base64 -w 0 sbom.xml)
      if [ -n "${CI_COMMIT_TAG}" ]; then
        echo "Uploading SBOM: project=${CI_PROJECT_NAME}, version=${CI_COMMIT_TAG}, parent=main"
        cat > payload.json <<PAYLOAD_EOF
      {
        "projectName": "${CI_PROJECT_NAME}",
        "projectVersion": "${CI_COMMIT_TAG}",
        "parentName": "${CI_PROJECT_NAME}",
        "parentVersion": "main",
        "autoCreate": true,
        "bom": "${BOM_B64}"
      }
      PAYLOAD_EOF
      else
        echo "Uploading SBOM: project=${CI_PROJECT_NAME}, version=main (überschreibt)"
        cat > payload.json <<PAYLOAD_EOF
      {
        "projectName": "${CI_PROJECT_NAME}",
        "projectVersion": "main",
        "autoCreate": true,
        "isLatest": true,
        "bom": "${BOM_B64}"
      }
      PAYLOAD_EOF
      fi
    - |
      curl -f -X "PUT" "${DTRACK_URL}/api/v1/bom" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: ${DTRACK_APIKEY}" \
        -d @payload.json
  artifacts:
    when: always
    paths:
      - sbom.xml
    expire_in: 2 days

release-latest:
  stage: deploy
  only:
    - master
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_HOST} -u ${HARBOR_USERNAME} --password-stdin
  script:
    - docker build --pull -t $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:latest .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:latest

release-tag:
  stage: deploy
  only:
    - tags
  except:
    - branches
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_HOST} -u ${HARBOR_USERNAME} --password-stdin
  script:
    - docker build --pull -t $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} -t $HARBOR_HOST/$HARBOR_PROJECT/csoc-v-${CI_PROJECT_NAME}:${CI_COMMIT_TAG} .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/csoc-v-${CI_PROJECT_NAME}:${CI_COMMIT_TAG}

push_to_deploy_repo:
  image: ${HARBOR_HOST}/${HARBOR_PROJECT}/csoc-glab:v1.58.0
  stage: deploy
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+.*$/'
  variables:
    NO_PROMPT: 1
    GITLAB_URI: https://git.dev.csoc.host
  dependencies:
    - "release-tag"
  before_script:
    - glab config -g set check_update false
  script:
    - bash ./scripts/ci_push_to_deploy_repo.sh
