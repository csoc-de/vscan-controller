default:
  image: ${HARBOR_HOST}/dockerhub/library/docker:28.0.1
  services:
    - name: ${HARBOR_HOST}/dockerhub/library/docker:28.0.1-dind
      alias: docker

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - lint
  - test
  - check
  - deploy

build:
  stage: build
  only:
    - branches
  except:
    - tags
  script:
    - docker build --pull .

linter:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: lint
  needs: [ ]
  before_script:
    - pip install pylint
    - pip install -r requirements.txt
  script:
    - pylint ${CI_PROJECT_DIR}/app

unit:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: test
  needs: [ ]
  before_script:
    - pip install pytest
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 2 days
sbom:
  image: ${HARBOR_HOST}/dockerhub/library/python:latest
  stage: check
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - default
  needs:
    - job: build
  variables:
    DTRACK_ID: ${DTRACK_PID}
    SBOM_CREATE_PAYLOAD: |
      cat > payload.json <<HERE
      {
      "project": "${DTRACK_PID}",
      "bom": "$(cat sbom.xml |base64 -)"
      }
      HERE
    SBOM_UPLOAD_COMMAND: 'curl -X "PUT" "https://dtrack-api.dev.csoc.host/api/v1/bom" -H "Content-Type: application/json" -H "X-API-Key: ${DTRACK_APIKEY}" -d @payload.json'
  before_script:
    - python3 -m venv /builds/${CI_PROJECT_PATH}/venv
    - cd /builds/${CI_PROJECT_PATH}
    - source venv/bin/activate
    - python -m pip install -r requirements.txt
    - python -m pip install cyclonedx-bom
  script:
    - cyclonedx-py environment --gather-license-texts -o sbom.xml --of XML -v --validate /builds/${CI_PROJECT_PATH}/venv
    - 'eval "$SBOM_CREATE_PAYLOAD"'
    - 'eval "$SBOM_UPLOAD_COMMAND"'
  artifacts:
    when: always
    paths:
      - sbom.xml
    expire_in: 2 days

release-latest:
  stage: deploy
  only:
    - master
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_HOST} -u ${HARBOR_USERNAME} --password-stdin
  script:
    - docker build --pull -t $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:latest .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:latest

release-tag:
  stage: deploy
  only:
    - tags
  except:
    - branches
  before_script:
    - echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_HOST} -u ${HARBOR_USERNAME} --password-stdin
  script:
    - docker build --pull -t $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:${CI_COMMIT_TAG} -t $HARBOR_HOST/$HARBOR_PROJECT/csoc-v-${CI_PROJECT_NAME}:${CI_COMMIT_TAG} .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/${CI_PROJECT_NAME}:${CI_COMMIT_TAG}
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/csoc-v-${CI_PROJECT_NAME}:${CI_COMMIT_TAG}
